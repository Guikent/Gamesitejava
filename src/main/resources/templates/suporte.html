<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Suporte</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body{ background:#0f172a; color:white; min-height: 100vh; }

        /* MENU NAV */
        header{ background:#111827; padding:20px 8%; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index: 1000; }
        .logo{ font-size:28px; font-weight:bold; }
        .logo span{ color:#38bdf8; }
        nav ul{ display:flex; list-style:none; gap:30px; }
        nav a{ color:white; text-decoration:none; font-weight:500; }
        nav a:hover{ color:#38bdf8; }

        .container { max-width: 600px; margin: 60px auto; padding: 20px; }
        h1 { font-size: 35px; margin-bottom: 10px; text-align: center; }
        .subtitulo { text-align: center; color: #94a3b8; margin-bottom: 40px; }

        /* Redes Sociais / Doação */
        .comunidade { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .btn-social { padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; transition: .3s; }
        .btn-discord { background: #5865F2; color: white; }
        .btn-doacao { background: #22c55e; color: white; }
        .btn-social:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* Caixa de Conteúdo */
        .box-suporte { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 20px; }
        label { margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 14px; border: 2px solid #334155; border-radius: 12px; background: #1f2937; color: white; font-size: 15px; transition: .3s; }
        input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { min-height: 140px; resize: vertical; }

        .btn-enviar { width: 100%; padding: 15px; background: #38bdf8; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; color: black; transition: .3s; }
        .btn-enviar:hover { background: #0ea5e9; transform: translateY(-2px); }

        /* Classes para esconder e mostrar a tela de sucesso */
        .hidden { display: none !important; }

        .sucesso-box { text-align: center; padding: 20px 0; }
        .sucesso-box .icone { font-size: 60px; color: #22c55e; margin-bottom: 20px; }
        .sucesso-box h2 { font-size: 28px; color: #22c55e; margin-bottom: 15px; }
        .sucesso-box p { color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }

        .btn-voltar { display: inline-block; padding: 12px 30px; background: #38bdf8; color: black; text-decoration: none; font-weight: bold; border-radius: 10px; transition: .3s; }
        .btn-voltar:hover { background: #0ea5e9; }
    </style>
</head>
<body>

<header>
    <div class="logo">Game<span>Store</span></div>
    <nav>
        <ul>
            <li><a th:href="@{/home}">Início</a></li>
            <li><a th:href="@{/games}">Loja</a></li>
            <li><a th:href="@{/suporte}">Suporte</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <h1>Suporte ao Cliente</h1>
    <p class="subtitulo">Estamos aqui para te ajudar com qualquer problema ou dúvida.</p>

    <div class="comunidade">
        <a href="https://discord.gg/seu-link" target="_blank" class="btn-social btn-discord">💬 Discord</a>
        <a href="https://livepix.gg/seu-link" target="_blank" class="btn-social btn-doacao">💰 Doação</a>
    </div>

    <div class="box-suporte">
        <form id="formFeedback" onsubmit="enviarFeedback(event)">
            <div class="form-group">
                <label>Seu Nome</label>
                <input type="text" placeholder="Digite seu nome" required>
            </div>
            <div class="form-group">
                <label>Seu E-mail</label>
                <input type="email" placeholder="nome@exemplo.com" required>
            </div>
            <div class="form-group">
                <label>Descreva seu problema</label>
                <textarea placeholder="Conte detalhadamente o que aconteceu..." required></textarea>
            </div>
            <button type="submit" class="btn-enviar">📩 Enviar Relatório</button>
        </form>
