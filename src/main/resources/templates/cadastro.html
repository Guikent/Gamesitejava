<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Cadastro</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body{ background:linear-gradient(135deg,#0f172a,#1e293b); min-height:100vh; color:white; }
        header{ height:80px; background:#0b1120; display:flex; justify-content:space-between; align-items:center; padding:0 50px; }
        .logo{ font-size:30px; font-weight:bold; }
        .logo span{ color:#38bdf8; }
        .home-btn{ background:#38bdf8; color:black; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
        .container{ display:flex; justify-content:center; padding:50px 20px; }
        .card{ width:100%; max-width:900px; background:#111827; border-radius:25px; padding:40px; }
        .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .form-group{ display:flex; flex-direction:column; }
        .full{ grid-column: 1 / 3; }
        label{ margin-bottom:8px; font-weight:600; }
        input, textarea, select{ width:100%; padding:14px; border:none; border-radius:12px; background:#1f2937; color:white; }
        .btn-save{ width:100%; padding:15px; background:#22c55e; border:none; border-radius:12px; font-weight:bold; color:white; cursor:pointer; margin-top:20px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Game<span>Store</span></div>
    <a th:href="@{/home}" class="home-btn">Início</a>
</header>

<div class="container">
    <div class="card">
        <h1>🎮 Cadastro de Jogos</h1>

        <form th:action="@{/cadastro}" th:object="${jogo}" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome do Jogo</label>
                    <input type="text" th:field="*{nome}" required>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select th:field="*{categoria}" required>
                        <option value="Ação">Ação</option>
                        <option value="RPG">RPG</option>
                        <option value="Aventura">Aventura</option>
                        <option value="Terror">Terror</option>
                        <option value="Corrida">Corrida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="text" th:field="*{preco}" required>
                </div>

                <div class="form-group full">
                    <label>URL da Imagem</label>
                    <input type="text" th:field="*{imagem}" required>
                </div>

                <div class="form-group full">
                    <label>Descrição</label>
                    <textarea th:field="*{desc}" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn-save">💾 Cadastrar Jogo</button>
        </form>
    </div>
</div>

</body>
</html>
