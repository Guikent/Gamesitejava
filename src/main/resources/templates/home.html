<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameStore - Início</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body{ background:#0f172a; color:white; }
        header{ background:#111827; padding:20px 8%; display:flex; justify-content:space-between; align-items:center; }
        .logo{ font-size:28px; font-weight:bold; }
        .logo span{ color:#38bdf8; }
        nav ul{ display:flex; list-style:none; gap:30px; }
        nav a{ color:white; text-decoration:none; font-weight:500; }
        nav a:hover{ color:#38bdf8; }
        .hero{ height:400px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)), url("https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1600"); background-size:cover; }
        .titulo{ text-align:center; margin:50px 0; font-size:35px; }
        .jogos{ width:90%; margin:auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; }
        .card{ background:#1e293b; border-radius:15px; overflow:hidden; cursor:pointer; }
        .card img{ width:100%; height:200px; object-fit:cover; }
        .card-info{ padding:15px; }
        .preco{ color:#38bdf8; font-weight:bold; margin-top:10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Game<span>Store</span></div>
    <nav>
        <ul>
            <li><a th:href="@{/home}">Início</a></li>
            <li><a th:href="@{/games}">Loja</a></li>
            <li><a th:href="@{/cadastro}">Cadastrar Jogos</a></li>
            <li><a th:href="@{/suporte}">Suporte</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h1>Bem-vindo à GameStore</h1>
    <p>Os melhores jogos em um só lugar.</p>
</section>

<h2 class="titulo">Destaques</h2>

<section class="jogos">
    <div class="card" th:each="jogo : ${jogos}">
        <img th:src="${jogo.imagem}" alt="Capa">
        <div class="card-info">
            <h3 th:text="${jogo.nome}">Nome</h3>
            <p th:text="${jogo.desc}">Descrição</p>
            <div class="preco" th:text="'R$ ' + ${jogo.preco}">R$ 0,00</div>
        </div>
    </div>
</section>

</body>
</html>>
