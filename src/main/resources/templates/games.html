<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Loja de Jogos</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body{ background:#0f172a; color:white; min-height: 100vh; padding-bottom: 50px; }

        header{ background:#111827; padding:20px 8%; display:flex; justify-content:space-between; align-items:center; }
        .logo{ font-size:28px; font-weight:bold; }
        .logo span{ color:#38bdf8; }
        nav ul{ display:flex; list-style:none; gap:30px; }
        nav a{ color:white; text-decoration:none; font-weight:500; }

        .titulo{ text-align:center; margin:40px 0 10px; font-size:35px; color: #38bdf8; }
        .subtitulo{ text-align:center; color:#94a3b8; margin-bottom:40px; }

        .jogos{ width:90%; margin:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:30px; }
        .card{ background:#1e293b; border-radius:15px; overflow:hidden; transition:.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card:hover{ transform:translateY(-8px); }
        .card img{ width:100%; height:200px; object-fit:cover; }
        .card-info{ padding:20px; }
        .card-info h3{ margin-bottom:8px; font-size:22px; }
        .bio { color: #94a3b8; font-size: 14px; margin-bottom: 15px; height: 60px; overflow: hidden; }
        .preco{ color:#22c55e; font-size:24px; font-weight:bold; margin-bottom: 10px; }
        .btn-pix { background: #32bcad; color: black; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: #111827; padding: 30px; border-radius: 20px; max-width: 400px; text-align: center; border: 2px solid #32bcad; }
        .close-btn { cursor: pointer; float: right; font-size: 20px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Game<span>Store</span></div>
    <nav>
        <ul>
            <li><a th:href="@{/home}">Início</a></li>
            <li><a th:href="@{/games}">Loja</a></li>
            <li><a th:href="@{/suporte}">Suporte</a></li>
        </ul>
    </nav>
</header>

<h2 class="titulo">Nossos Jogos</h2>
<p class="subtitulo">Escolha o seu favorito e aventure-se!</p>

<section class="jogos">
    <div class="card" th:each="jogo : ${jogos}">
        <img th:src="${jogo.imagem}" alt="Capa do Jogo">
        <div class="card-info">
            <h3 th:text="${jogo.nome}">Nome</h3>
            <p class="bio" th:text="${jogo.desc}">Descrição...</p>
            <div class="preco" th:text="'R$ ' + ${jogo.preco}">R$ 0,00</div>
            <button class="btn-pix" th:attr="onclick=|abrirPix
